[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tumorvolumetrics"
version = "0.1.0"
description = "A PySide6-based desktop application for analyzing tumor volume data"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

authors = [
  { name = "Dennis A. Dean II", email = "dennis.a.dean@gmail.com" }
]

dependencies = [
  # GUI
  "PySide6>=6.5.0,<7",

  # Scientific stack
  "numpy>=1.23.0,<3.0",
  "pandas>=1.5.0,<3.0",
  "scipy>=1.10.0,<2.0",
  "matplotlib>=3.7.0,<4.0",

  # Stats
  "lifelines>=0.27.0,<1.0",
  "autograd>=1.6.0,<2.0",
  "autograd-gamma>=0.5.0,<1.0",

  # Visualization
  "SciencePlots>=2.0.0,<3.0",
  "latex>=0.7.0,<1.0",

  # Modeling
  "formulaic>=1.0.0,<2.0",

  # Data compatibility
  "narwhals>=1.0.0,<3.0"
]

[project.scripts]
tumorvolumetrics = "tumorvolumetrics.app:main"

[tool.setuptools.package-data]
tumorvolumetrics = [
  "data/*"
]